name: Bug report
description: Report something that doesn't work as expected
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check the open issues first, it may already be reported.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we make the bug happen?
      placeholder: |
        1. Place block '...'
        2. Insert item '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: "e.g. 1.5.4"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "e.g. 1.21.1"
    validations:
      required: true

  - type: input
    id: loader-version
    attributes:
      label: Mod loader and version
      placeholder: "e.g. NeoForge 21.1.231"
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other relevant mods
      description: Mods that might be involved, with their versions (e.g. Create, Jade, JEI, KubeJS).
      placeholder: "e.g. Create 6.0.6"

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste a link to your `latest.log` or crash report (use https://mclo.gs or a similar site).

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, videos or anything else that helps.
